
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK STORE — Магазин техніки</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>


/* =================================
   BLACK STORE — PREMIUM DARK GLASS
================================= */

:root {
  --bg: #0b0c0f;
  --surface: #14161a;
  --surface-light: #1b1e23;
  --text: #f2f3f5;
  --muted: #92969e;
  --accent: #e58a50;
  --accent-light: #ffad75;
  --border: rgba(255,255,255,.085);
  --glass: rgba(255,255,255,.045);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.5;
}

/* Фоновое свечение */

body::before {
  content: "";
  position: fixed;
  z-index: -2;
  inset: -30%;
  pointer-events: none;
  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(196,91,40,.13),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 35%,
      rgba(180,91,48,.10),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 90%,
      rgba(120,55,30,.09),
      transparent 32%
    );
  filter: blur(65px);
  animation: backgroundMove 22s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
  0% {
    transform: translate(-2%, -2%) scale(1);
  }
  50% {
    transform: translate(3%, 2%) scale(1.08);
  }
  100% {
    transform: translate(-1%, 4%) scale(1.04);
  }
}

/* Общие элементы */

button,
input,
textarea {
  font-family: inherit;
}

button {
  border: 1px solid rgba(229,138,80,.28);
  background: #242323;
  color: #f5f5f5;
  padding: 12px 19px;
  border-radius: 13px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition:
    background .25s ease,
    border-color .25s ease,
    transform .25s ease,
    box-shadow .25s ease;
}

button:hover {
  background: #302720;
  border-color: rgba(229,138,80,.65);
  box-shadow: 0 5px 22px rgba(229,138,80,.10);
  transform: translateY(-2px);
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.secondary {
  background: rgba(255,255,255,.045);
  border: 1px solid var(--border);
  color: #d5d5d5;
  box-shadow: none;
}

.secondary:hover {
  background: rgba(255,255,255,.09);
  border-color: rgba(229,138,80,.35);
  box-shadow: none;
}

/* Шапка */

header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
  padding: 17px 5%;

  background: rgba(13,14,17,.82);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  border-bottom: 1px solid var(--border);
  box-shadow: 0 8px 30px rgba(0,0,0,.18);
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -1.3px;
  color: white;
}

.logo span {
  color: var(--accent-light);
  text-shadow: 0 0 18px rgba(229,138,80,.18);
}

/* Поиск */

.search {
  flex: 1;
  max-width: 520px;
  padding: 14px 18px;
  border-radius: 14px;

  background: rgba(255,255,255,.045);
  border: 1px solid var(--border);
  color: white;
  font-size: 14px;
  outline: none;

  transition: .25s;
}

.search::placeholder {
  color: #777c84;
}

.search:focus {
  background: rgba(255,255,255,.07);
  border-color: rgba(229,138,80,.55);
  box-shadow: 0 0 18px rgba(229,138,80,.08);
}

/* Категории */

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px 5%;

  background: rgba(255,255,255,.018);
  border-bottom: 1px solid rgba(255,255,255,.045);
}

nav button {
  padding: 9px 18px;
  border-radius: 30px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.075);
  color: #b9bbc1;
  font-size: 13px;
  box-shadow: none;
}

nav button:hover {
  background: rgba(255,255,255,.075);
  color: white;
  box-shadow: none;
}

nav button.active {
  color: #f3b187;
  background: rgba(229,138,80,.11);
  border-color: rgba(229,138,80,.4);
  box-shadow: 0 0 15px rgba(229,138,80,.06);
}

/* Главный баннер */

.hero {
  position: relative;
  overflow: hidden;
  margin: 32px 5%;
  padding: 65px 45px;
  border-radius: 25px;

  background:
    radial-gradient(
      ellipse at 90% 50%,
      rgba(192,100,55,.14),
      transparent 50%
    ),
    linear-gradient(
      120deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.018)
    );

  border: 1px solid rgba(255,255,255,.10);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  box-shadow:
    0 20px 60px rgba(0,0,0,.20),
    inset 0 1px rgba(255,255,255,.06);
}

.hero::after {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  right: -80px;
  top: -120px;
  border-radius: 50%;
  border: 1px solid rgba(229,138,80,.18);
  box-shadow:
    0 0 70px rgba(229,138,80,.07),
    inset 0 0 50px rgba(229,138,80,.07);
  pointer-events: none;
  animation: heroFloat 12s ease-in-out infinite alternate;
}

@keyframes heroFloat {
  from {
    transform: translateY(-5px) scale(.95);
  }
  to {
    transform: translateY(35px) scale(1.12);
  }
}

.hero h1 {
  position: relative;
  z-index: 1;
  max-width: 650px;
  font-size: clamp(30px, 5vw, 47px);
  line-height: 1.15;
  letter-spacing: -1.5px;
  margin-bottom: 15px;

  background: linear-gradient(
    100deg,
    #fff 10%,
    #e9b18e 65%,
    #d9844c 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p {
  position: relative;
  z-index: 1;
  color: #a9abb1;
  font-size: 15px;
  margin-bottom: 23px;
}

.hero button {
  position: relative;
  z-index: 2;
  background: #282421;
  border-color: rgba(229,138,80,.4);
}

/* Каталог */

main {
  padding: 25px 5% 65px;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.heading h2 {
  font-size: 25px;
  letter-spacing: -.5px;
  font-weight: 750;
}

#resultCount {
  color: var(--muted);
  font-size: 13px;
}

/* Карточки товаров */

.products {
  display: grid;
  grid-template-columns: repeat(
    auto-fill,
    minmax(220px, 1fr)
  );
  gap: 20px;
}

.card {
  position: relative;
  overflow: hidden;
  border-radius: 20px;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.065),
    rgba(255,255,255,.018)
  );

  border: 1px solid rgba(255,255,255,.085);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow: 0 10px 35px rgba(0,0,0,.20);

  transition:
    transform .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

.card:hover {
  transform: translateY(-6px);
  border-color: rgba(229,138,80,.38);
  box-shadow:
    0 16px 40px rgba(0,0,0,.35),
    0 0 20px rgba(229,138,80,.055);
}

.photo {
  height: 205px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;

  background: rgba(0,0,0,.20);
  border-bottom: 1px solid rgba(255,255,255,.055);
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 13px;
  transition: transform .4s ease;
}

.card:hover .photo img {
  transform: scale(1.045);
}

.info {
  padding: 17px;
}

.category {
  color: #d99a70;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 9px;
}

.info h3 {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.45;
  min-height: 44px;
  margin-bottom: 13px;
  color: #eee;
}

.price {
  color: #f2e7df;
  font-size: 21px;
  font-weight: 750;
  margin-bottom: 12px;
}

.stock {
  font-size: 12px;
  color: #92979e;
  margin-bottom: 14px;
}

.actions {
  display: flex;
  gap: 8px;
}

.actions button {
  flex: 1;
  padding: 11px 8px;
  font-size: 13px;
}

.actions button:first-child {
  background: #30251f;
  border-color: rgba(229,138,80,.32);
  color: #f0b28d;
}

.actions button:first-child:hover {
  background: #3b2b22;
  border-color: rgba(229,138,80,.65);
}

/* Корзина */

.panel {
  position: fixed;
  z-index: 40;
  top: 0;
  right: 0;

  width: min(430px, 100%);
  height: 100%;
  padding: 24px;
  overflow: auto;

  background: rgba(17,18,22,.94);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);

  border-left: 1px solid rgba(255,255,255,.11);
  box-shadow: -15px 0 55px rgba(0,0,0,.4);

  transform: translateX(110%);
  transition: transform .35s ease;
}

.panel.open {
  transform: translateX(0);
}

.panelhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.panelhead h2 {
  font-size: 22px;
}

.cartitem {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.total {
  font-size: 23px;
  font-weight: 750;
  color: #e9a477;
  margin: 25px 0;
}

/* Модальные окна */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  padding: 15px;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.dialog {
  width: min(460px, 100%);
  max-height: 90vh;
  overflow: auto;
  padding: 27px;

  background: rgba(25,26,30,.97);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 21px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.55),
    0 0 25px rgba(229,138,80,.045);

  animation: dialogAppear .25s ease;
}

@keyframes dialogAppear {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.dialog h2 {
  margin-bottom: 16px;
  font-size: 22px;
}

.dialog input,
.dialog textarea {
  width: 100%;
  padding: 14px;
  margin: 7px 0;

  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 11px;

  color: white;
  font-size: 14px;
  outline: none;
  transition: .25s;
}

.dialog input:focus,
.dialog textarea:focus {
  border-color: rgba(229,138,80,.55);
  background: rgba(255,255,255,.065);
}

.dialog input::placeholder,
.dialog textarea::placeholder {
  color: #777c84;
}

.dialog button {
  margin-top: 9px;
}

.muted {
  color: #969ba3;
  font-size: 13px;
  line-height: 1.6;
}

/* Уведомления */

#notice {
  padding: 12px 5%;
  color: #dba17b;
  font-size: 14px;
}

/* Подвал */

footer {
  padding: 32px 20px;
  text-align: center;

  background: rgba(255,255,255,.018);
  border-top: 1px solid rgba(255,255,255,.07);

  color: #777c84;
  font-size: 13px;
}

/* Мобильная версия */

@media(max-width: 600px) {
  header {
    padding: 14px 4%;
    gap: 12px;
  }

  .logo {
    font-size: 23px;
  }

  .search {
    order: 3;
    width: 100%;
    max-width: none;
  }

  nav {
    padding: 13px 4%;
  }

  .hero {
    margin: 20px 4%;
    padding: 38px 23px;
  }

  .hero h1 {
    font-size: 29px;
  }

  main {
    padding: 20px 4% 45px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 12px;
  }

  .photo {
    height: 145px;
  }

  .info {
    padding: 12px;
  }

  .info h3 {
    font-size: 13px;
    min-height: 48px;
  }

  .price {
    font-size: 18px;
  }

  .actions {
    flex-direction: column;
  }

  .actions button {
    width: 100%;
    padding: 10px 5px;
  }

  .hero::after {
    right: -150px;
  }
}

/* Уменьшение анимаций по настройке устройства */

@media(prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
</head>
<body>

<header>
 <div class="logo">BLACK<span>STORE</span></div>
 <input class="search" id="search" placeholder="Пошук товарів..." oninput="render()">
 <button onclick="toggleCart()">🛒 Кошик (<span id="count">0</span>)</button>
 <button class="secondary" id="accountBtn" onclick="openAuth()">Увійти</button>
</header>
<nav id="categories">
 <button class="active" onclick="setCategory('Усі')">Усі товари</button>
</nav>
<section class="hero">
 <h1>ТЕХНІКА. ЯКІСТЬ. СТИЛЬ.</h1>
 <p>Обирай сучасну техніку в BLACK STORE</p>
 <button onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">До каталогу →</button>
</section>
<div id="notice"></div>
<main id="catalog">
 <div class="heading"><h2>Каталог товарів</h2><span id="resultCount"></span></div>
 <div class="products" id="products">Завантажуємо товари...</div>
</main>
<div class="panel" id="cartPanel">
 <div class="panelhead"><h2>Ваш кошик</h2><button onclick="toggleCart()">✕</button></div>
 <div id="cartItems"></div>
 <div class="total" id="total">Разом: 0 ₴</div>
 <button style="width:100%" onclick="checkout()">Оформити замовлення</button>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeDialog()">
 <div class="dialog" id="dialog"></div>
</div>
<footer>© 2026 BLACK STORE · Інтернет-магазин техніки</footer>

<script>
/* ВСТАВ СЮДИ СВОЇ ДВА ЗНАЧЕННЯ З SUPABASE */
const SUPABASE_URL = "https://khpbevlmqypfqkniedcu.supabase.co";
const SUPABASE_KEY = "sb_publishable_MxvX0vg45TxzAqPJrmIWSA_8qpcbUxi";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[],cart=JSON.parse(localStorage.getItem("bs_cart")||"[]");
let selected="Усі",currentUser=null;

const money=n=>Number(n).toLocaleString("uk-UA")+" ₴";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function message(s){document.getElementById("notice").textContent=s}
function openDialog(html){document.getElementById("dialog").innerHTML=html;document.getElementById("overlay").style.display="flex"}
function closeDialog(){document.getElementById("overlay").style.display="none"}
function toggleCart(){document.getElementById("cartPanel").classList.toggle("open")}

async function loadProducts(){
 const {data,error}=await db.from("products")
  .select("id,name,description,category,price,image_url,stock")
  .eq("is_active",true).order("id");
 if(error){message("Не вдалося завантажити товари: "+error.message);return}
 products=data||[];
 renderCategories();render();
}

function renderCategories(){
 const cats=["Усі",...new Set(products.map(p=>p.category))];
 document.getElementById("categories").innerHTML=cats.map(c=>
 `<button class="${selected===c?"active":""}" onclick="setCategory('${esc(c)}')">${esc(c==="Усі"?"Усі товари":c)}</button>`
 ).join("");
}
function setCategory(c){selected=c;renderCategories();render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>(selected==="Усі"||p.category===selected)&&p.name.toLowerCase().includes(q));
 document.getElementById("resultCount").textContent="Знайдено: "+list.length;
 document.getElementById("products").innerHTML=list.length?list.map(p=>
 `<article class="card">
 <div class="photo"><img src="${esc(p.image_url||"")}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'"></div>
 <div class="info"><div class="category">${esc(p.category)}</div>
 <h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div>
 <div class="stock">${p.stock>0?"В наявності: "+p.stock:"Немає в наявності"}</div>
 <div class="actions"><button ${p.stock<=0?"disabled":""} onclick="addToCart(${p.id})">У кошик</button>
 <button class="secondary" onclick="details(${p.id})">Деталі</button></div></div></article>`
 ).join(""):"Товарів не знайдено";
}

function addToCart(id){
 const p=products.find(x=>x.id===id);if(!p||p.stock<=0)return;
 const item=cart.find(x=>x.id===id);
 if(item){if(item.qty>=p.stock){message("Більше товару немає на складі");return}item.qty++}
 else cart.push({id,qty:1});
 saveCart();message("Товар додано до кошика");
}
function saveCart(){localStorage.setItem("bs_cart",JSON.stringify(cart));updateCart()}
function updateCart(){
 document.getElementById("count").textContent=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById("cartItems").innerHTML=cart.length?cart.map(x=>{
 const p=products.find(p=>p.id===x.id);if(!p)return "";
 return `<div class="cartitem"><div>${esc(p.name)}<br>${money(p.price)} × ${x.qty}</div>
 <div><button onclick="changeQty(${x.id},-1)">−</button> <button onclick="changeQty(${x.id},1)">+</button></div></div>`;
 }).join(""):"Кошик порожній";
 document.getElementById("total").textContent="Разом: "+money(cart.reduce((s,x)=>{const p=products.find(p=>p.id===x.id);return s+(p?p.price*x.qty:0)},0));
}
function changeQty(id,n){
 const x=cart.find(x=>x.id===id),p=products.find(p=>p.id===id);if(!x)return;
 x.qty+=n;if(x.qty<=0)cart=cart.filter(a=>a.id!==id);
 if(p&&x.qty>p.stock)x.qty=p.stock;
 saveCart();
}
function details(id){
 const p=products.find(p=>p.id===id);if(!p)return;
 openDialog(`<button class="secondary" onclick="closeDialog()">Закрити</button>
 <h2 style="margin-top:15px">${esc(p.name)}</h2><p class="category">${esc(p.category)}</p>
 <p>${esc(p.description||"Опис уточнюється")}</p><h2 style="margin:15px 0">${money(p.price)}</h2>
 <p class="muted">Наявність: ${p.stock}</p>
 <button onclick="addToCart(${p.id});closeDialog()">Додати до кошика</button>`);
}

function openAuth(){
 openDialog(`<h2>Особистий кабінет</h2>
 <form onsubmit="signIn(event)">
 <input id="email" type="email" placeholder="Email" required>
 <input id="password" type="password" placeholder="Пароль (мінімум 6 символів)" minlength="6" required>
 <button style="width:100%">Увійти</button></form>
 <button class="secondary" style="width:100%" onclick="signUp()">Створити акаунт</button>
 <p class="muted" id="authMessage" style="margin-top:12px"></p>`);
}
async function signIn(e){
 e.preventDefault();
 const {data,error}=await db.auth.signInWithPassword({
  email:document.getElementById("email").value,
  password:document.getElementById("password").value
 });
 if(error){document.getElementById("authMessage").textContent=error.message;return}
 currentUser=data.user;closeDialog();updateAccount();
}
async function signUp(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;
 if(!email||password.length<6){document.getElementById("authMessage").textContent="Введіть email і пароль від 6 символів";return}
 const {data,error}=await db.auth.signUp({email,password});
 document.getElementById("authMessage").textContent=error?error.message:
 "Реєстрація успішна. Якщо підтвердження email увімкнено, перевірте пошту.";
 if(data.user&&!data.session) return;
 if(data.user){currentUser=data.user;closeDialog();updateAccount()}
}
async function logout(){await db.auth.signOut();currentUser=null;updateAccount();message("Ви вийшли з акаунта")}
function updateAccount(){
 const b=document.getElementById("accountBtn");
 b.textContent=currentUser?"Вийти ("+(currentUser.email||"акаунт")+")":"Увійти";
 b.onclick=currentUser?logout:openAuth;
}

function checkout(){
 if(!cart.length){message("Кошик порожній");return}
 if(!currentUser){toggleCart();openAuth();message("Увійдіть або створіть акаунт для замовлення");return}
 openDialog(`<h2>Оформлення замовлення</h2>
 <form onsubmit="sendOrder(event)">
 <input id="customer" placeholder="Ваше ім’я" required>
 <input id="phone" placeholder="Номер телефону" required>
 <input id="city" placeholder="Місто" required>
 <input id="branch" placeholder="Відділення Нової пошти">
 <textarea id="comment" placeholder="Коментар до замовлення"></textarea>
 <p class="muted">Оплата при отриманні. Підтвердження замовлення буде доступне після оформлення.</p>
 <button style="width:100%">Підтвердити замовлення</button></form>`);
}
async function sendOrder(e){
 e.preventDefault();
 const btn=e.submitter;btn.disabled=true;btn.textContent="Обробка...";
 const items=cart.map(x=>({product_id:x.id,quantity:x.qty}));
 const {data,error}=await db.rpc("create_order",{
  p_customer_name:document.getElementById("customer").value,
  p_phone:document.getElementById("phone").value,
  p_city:document.getElementById("city").value,
  p_nova_poshta_branch:document.getElementById("branch").value,
  p_comment:document.getElementById("comment").value,
  p_items:items
 });
 if(error){btn.disabled=false;btn.textContent="Підтвердити замовлення";message("Помилка: "+error.message);return}
 cart=[];saveCart();closeDialog();document.getElementById("cartPanel").classList.remove("open");
 await loadProducts();message("Замовлення №"+data+" успішно створено! Дякуємо за покупку.");
}

async function init(){
 const {data}=await db.auth.getSession();
 currentUser=data.session?.user||null;updateAccount();
 db.auth.onAuthStateChange((_event,session)=>{
  currentUser=session?.user||null;updateAccount();
 });
 await loadProducts();updateCart();
}
init();
</script>
</body>
</html>

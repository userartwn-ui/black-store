
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACK STORE — Магазин техніки</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --orange: #ff7200;
  --orange-light: #ff9b45;
  --glass: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.11);
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  isolation: isolate;
  overflow-x: hidden;
  background: #08090d;
  color: #f7f7f7;
  font-family: Arial, sans-serif;
}

/* Живой неоновый фон */
body::before {
  content: "";
  position: fixed;
  inset: -40%;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 15% 20%, rgba(255,95,0,.20), transparent 35%),
    radial-gradient(ellipse at 85% 35%, rgba(255,130,0,.15), transparent 32%),
    radial-gradient(ellipse at 50% 90%, rgba(255,65,0,.12), transparent 35%);
  filter: blur(45px);
  animation: backgroundFlow 14s ease-in-out infinite alternate;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .16;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 45px 45px;
  mask-image: linear-gradient(to bottom, black, transparent 90%);
}

@keyframes backgroundFlow {
  0% {
    transform: translate(-4%, -2%) scale(1);
  }
  50% {
    transform: translate(3%, 4%) scale(1.12);
  }
  100% {
    transform: translate(-2%, 2%) scale(1.05);
  }
}

/* Стеклянная шапка */
header {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 17px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  background: rgba(12,13,17,.72);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-bottom: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 8px 35px rgba(0,0,0,.25);
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -1px;
  text-shadow: 0 0 20px rgba(255,110,0,.2);
}

.logo span {
  color: var(--orange);
  text-shadow: 0 0 18px rgba(255,110,0,.7);
}

.search {
  flex: 1;
  max-width: 520px;
  padding: 14px 17px;
  border-radius: 12px;
  color: white;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.12);
  outline: none;
  transition: .3s;
}

.search:focus {
  border-color: var(--orange);
  box-shadow: 0 0 20px rgba(255,110,0,.2);
  background: rgba(255,255,255,.08);
}

.search::placeholder {
  color: #888;
}

/* Кнопки */
button {
  padding: 12px 18px;
  border: 1px solid rgba(255,145,65,.45);
  border-radius: 11px;
  background: linear-gradient(135deg,#ff8a24,#ed5300);
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(255,95,0,.18);
  transition: transform .25s, box-shadow .25s, filter .25s;
}

button:hover {
  transform: translateY(-2px);
  filter: brightness(1.15);
  box-shadow: 0 0 25px rgba(255,105,0,.4);
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.secondary {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.13);
  box-shadow: none;
}

.secondary:hover {
  background: rgba(255,255,255,.13);
  border-color: rgba(255,130,40,.5);
}

/* Категории */
nav {
  position: relative;
  padding: 15px 5%;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  background: rgba(255,255,255,.025);
  border-bottom: 1px solid rgba(255,255,255,.06);
}

nav button {
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: none;
  border-radius: 30px;
}

nav button.active {
  background: linear-gradient(135deg,#ff8a24,#ed5300);
  border-color: transparent;
  box-shadow: 0 0 20px rgba(255,105,0,.3);
}

/* Главный баннер */
.hero {
  position: relative;
  overflow: hidden;
  margin: 35px 5%;
  padding: 65px 45px;
  border-radius: 25px;
  border: 1px solid rgba(255,255,255,.13);
  background:
    linear-gradient(115deg,rgba(255,255,255,.09),rgba(255,255,255,.015)),
    radial-gradient(ellipse at 85% 50%,rgba(255,105,0,.23),transparent 55%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 20px 70px rgba(0,0,0,.3),
              inset 0 1px rgba(255,255,255,.1);
}

.hero::after {
  content: "";
  position: absolute;
  width: 300px;
  height: 300px;
  right: 5%;
  top: -130px;
  border-radius: 50%;
  border: 1px solid rgba(255,130,30,.3);
  box-shadow: 0 0 50px rgba(255,100,0,.12),
              inset 0 0 50px rgba(255,100,0,.1);
  animation: heroGlow 7s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes heroGlow {
  from { transform: scale(.9) rotate(0deg); opacity: .45; }
  to { transform: scale(1.2) rotate(35deg); opacity: 1; }
}

.hero h1 {
  position: relative;
  z-index: 1;
  max-width: 650px;
  font-size: clamp(30px,5vw,48px);
  line-height: 1.15;
  margin-bottom: 15px;
  background: linear-gradient(90deg,#fff,#ffb16f,#ff6900);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p {
  position: relative;
  z-index: 1;
  color: #bbb;
  font-size: 16px;
  margin-bottom: 25px;
}

.hero button {
  position: relative;
  z-index: 2;
}

/* Каталог */
main {
  padding: 25px 5% 65px;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  gap: 12px;
  flex-wrap: wrap;
}

.heading h2 {
  font-size: 26px;
}

#resultCount {
  color: #999;
  font-size: 14px;
}

/* Стеклянные карточки */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
  gap: 22px;
}

.card {
  position: relative;
  overflow: hidden;
  border-radius: 19px;
  background: linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 12px 35px rgba(0,0,0,.23);
  transition: transform .35s, border-color .35s, box-shadow .35s;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(125deg,rgba(255,125,30,.13),transparent 45%);
  transition: opacity .35s;
}

.card:hover {
  transform: translateY(-8px);
  border-color: rgba(255,125,35,.6);
  box-shadow: 0 15px 45px rgba(255,90,0,.13),
              0 0 25px rgba(255,100,0,.09);
}

.card:hover::before {
  opacity: 1;
}

.photo {
  position: relative;
  height: 205px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: rgba(0,0,0,.2);
  border-bottom: 1px solid rgba(255,255,255,.07);
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
  transition: transform .4s;
}

.card:hover .photo img {
  transform: scale(1.06);
}

.info {
  position: relative;
  padding: 17px;
}

.category {
  color: #ff9b55;
  font-size: 12px;
  letter-spacing: .5px;
  margin-bottom: 10px;
  text-transform: uppercase;
}

.info h3 {
  font-size: 16px;
  min-height: 44px;
  line-height: 1.4;
  margin-bottom: 13px;
}

.price {
  font-size: 22px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 13px;
  text-shadow: 0 0 15px rgba(255,110,0,.2);
}

.stock {
  font-size: 12px;
  color: #aaa;
  margin-bottom: 14px;
}

.actions {
  display: flex;
  gap: 8px;
}

.actions button {
  flex: 1;
  padding: 11px 5px;
  font-size: 13px;
}

/* Кошик */
.panel {
  position: fixed;
  right: 0;
  top: 0;
  width: min(430px,100%);
  height: 100%;
  z-index: 40;
  padding: 24px;
  overflow: auto;
  background: rgba(15,16,20,.88);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-left: 1px solid rgba(255,255,255,.12);
  box-shadow: -20px 0 70px rgba(0,0,0,.5);
  transform: translateX(110%);
  transition: transform .35s cubic-bezier(.2,.8,.2,1);
}

.panel.open {
  transform: translateX(0);
}

.panelhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.cartitem {
  padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,.1);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.total {
  font-size: 23px;
  font-weight: bold;
  margin: 25px 0;
  color: #ff9b55;
}

/* Затемнение и стеклянные окна */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  padding: 15px;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  align-items: center;
  justify-content: center;
}

.dialog {
  width: min(460px,100%);
  max-height: 90vh;
  overflow: auto;
  padding: 27px;
  border-radius: 22px;
  background: linear-gradient(145deg,rgba(36,37,43,.96),rgba(15,16,20,.96));
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 25px 90px rgba(0,0,0,.65),
              0 0 35px rgba(255,100,0,.09);
  animation: dialogIn .25s ease-out;
}

@keyframes dialogIn {
  from { opacity: 0; transform: translateY(15px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.dialog h2 {
  margin-bottom: 16px;
}

.dialog input,
.dialog textarea {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  color: white;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 10px;
  outline: none;
  font: inherit;
}

.dialog input:focus,
.dialog textarea:focus {
  border-color: var(--orange);
  box-shadow: 0 0 15px rgba(255,105,0,.15);
}

.dialog input::placeholder,
.dialog textarea::placeholder {
  color: #888;
}

.dialog button {
  margin-top: 9px;
}

.muted {
  color: #aaa;
  font-size: 13px;
  line-height: 1.6;
}

#notice {
  padding: 12px 5%;
  color: #ffad70;
  text-shadow: 0 0 12px rgba(255,100,0,.2);
}

footer {
  padding: 35px;
  text-align: center;
  color: #888;
  background: rgba(255,255,255,.025);
  border-top: 1px solid rgba(255,255,255,.08);
}

/* Мобильная версия */
@media(max-width:600px) {
  header {
    padding: 15px 4%;
    gap: 12px;
  }

  .logo {
    font-size: 23px;
  }

  .search {
    order: 3;
    max-width: none;
    width: 100%;
  }

  .hero {
    margin: 20px 4%;
    padding: 38px 23px;
  }

  .hero h1 {
    font-size: 29px;
  }

  .hero::after {
    right: -120px;
  }

  main {
    padding: 20px 4% 45px;
  }

  .products {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 12px;
  }

  .photo {
    height: 145px;
  }

  .info {
    padding: 12px;
  }

  .info h3 {
    font-size: 14px;
  }

  .price {
    font-size: 18px;
  }

  .actions {
    flex-direction: column;
  }

  .actions button {
    width: 100%;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

</style>
</head>
<body>
<header>
 <div class="logo">BLACK<span>STORE</span></div>
 <input class="search" id="search" placeholder="Пошук товарів..." oninput="render()">
 <button onclick="toggleCart()">🛒 Кошик (<span id="count">0</span>)</button>
 <button class="secondary" id="accountBtn" onclick="openAuth()">Увійти</button>
</header>
<nav id="categories">
 <button class="active" onclick="setCategory('Усі')">Усі товари</button>
</nav>
<section class="hero">
 <h1>ТЕХНІКА. ЯКІСТЬ. СТИЛЬ.</h1>
 <p>Обирай сучасну техніку в BLACK STORE</p>
 <button onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">До каталогу →</button>
</section>
<div id="notice"></div>
<main id="catalog">
 <div class="heading"><h2>Каталог товарів</h2><span id="resultCount"></span></div>
 <div class="products" id="products">Завантажуємо товари...</div>
</main>
<div class="panel" id="cartPanel">
 <div class="panelhead"><h2>Ваш кошик</h2><button onclick="toggleCart()">✕</button></div>
 <div id="cartItems"></div>
 <div class="total" id="total">Разом: 0 ₴</div>
 <button style="width:100%" onclick="checkout()">Оформити замовлення</button>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeDialog()">
 <div class="dialog" id="dialog"></div>
</div>
<footer>© 2026 BLACK STORE · Інтернет-магазин техніки</footer>

<script>
/* ВСТАВ СЮДИ СВОЇ ДВА ЗНАЧЕННЯ З SUPABASE */
const SUPABASE_URL = "https://khpbevlmqypfqkniedcu.supabase.co";
const SUPABASE_KEY = "sb_publishable_MxvX0vg45TxzAqPJrmIWSA_8qpcbUxi";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[],cart=JSON.parse(localStorage.getItem("bs_cart")||"[]");
let selected="Усі",currentUser=null;

const money=n=>Number(n).toLocaleString("uk-UA")+" ₴";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function message(s){document.getElementById("notice").textContent=s}
function openDialog(html){document.getElementById("dialog").innerHTML=html;document.getElementById("overlay").style.display="flex"}
function closeDialog(){document.getElementById("overlay").style.display="none"}
function toggleCart(){document.getElementById("cartPanel").classList.toggle("open")}

async function loadProducts(){
 const {data,error}=await db.from("products")
  .select("id,name,description,category,price,image_url,stock")
  .eq("is_active",true).order("id");
 if(error){message("Не вдалося завантажити товари: "+error.message);return}
 products=data||[];
 renderCategories();render();
}

function renderCategories(){
 const cats=["Усі",...new Set(products.map(p=>p.category))];
 document.getElementById("categories").innerHTML=cats.map(c=>
 `<button class="${selected===c?"active":""}" onclick="setCategory('${esc(c)}')">${esc(c==="Усі"?"Усі товари":c)}</button>`
 ).join("");
}
function setCategory(c){selected=c;renderCategories();render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>(selected==="Усі"||p.category===selected)&&p.name.toLowerCase().includes(q));
 document.getElementById("resultCount").textContent="Знайдено: "+list.length;
 document.getElementById("products").innerHTML=list.length?list.map(p=>
 `<article class="card">
 <div class="photo"><img src="${esc(p.image_url||"")}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'"></div>
 <div class="info"><div class="category">${esc(p.category)}</div>
 <h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div>
 <div class="stock">${p.stock>0?"В наявності: "+p.stock:"Немає в наявності"}</div>
 <div class="actions"><button ${p.stock<=0?"disabled":""} onclick="addToCart(${p.id})">У кошик</button>
 <button class="secondary" onclick="details(${p.id})">Деталі</button></div></div></article>`
 ).join(""):"Товарів не знайдено";
}

function addToCart(id){
 const p=products.find(x=>x.id===id);if(!p||p.stock<=0)return;
 const item=cart.find(x=>x.id===id);
 if(item){if(item.qty>=p.stock){message("Більше товару немає на складі");return}item.qty++}
 else cart.push({id,qty:1});
 saveCart();message("Товар додано до кошика");
}
function saveCart(){localStorage.setItem("bs_cart",JSON.stringify(cart));updateCart()}
function updateCart(){
 document.getElementById("count").textContent=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById("cartItems").innerHTML=cart.length?cart.map(x=>{
 const p=products.find(p=>p.id===x.id);if(!p)return "";
 return `<div class="cartitem"><div>${esc(p.name)}<br>${money(p.price)} × ${x.qty}</div>
 <div><button onclick="changeQty(${x.id},-1)">−</button> <button onclick="changeQty(${x.id},1)">+</button></div></div>`;
 }).join(""):"Кошик порожній";
 document.getElementById("total").textContent="Разом: "+money(cart.reduce((s,x)=>{const p=products.find(p=>p.id===x.id);return s+(p?p.price*x.qty:0)},0));
}
function changeQty(id,n){
 const x=cart.find(x=>x.id===id),p=products.find(p=>p.id===id);if(!x)return;
 x.qty+=n;if(x.qty<=0)cart=cart.filter(a=>a.id!==id);
 if(p&&x.qty>p.stock)x.qty=p.stock;
 saveCart();
}
function details(id){
 const p=products.find(p=>p.id===id);if(!p)return;
 openDialog(`<button class="secondary" onclick="closeDialog()">Закрити</button>
 <h2 style="margin-top:15px">${esc(p.name)}</h2><p class="category">${esc(p.category)}</p>
 <p>${esc(p.description||"Опис уточнюється")}</p><h2 style="margin:15px 0">${money(p.price)}</h2>
 <p class="muted">Наявність: ${p.stock}</p>
 <button onclick="addToCart(${p.id});closeDialog()">Додати до кошика</button>`);
}

function openAuth(){
 openDialog(`<h2>Особистий кабінет</h2>
 <form onsubmit="signIn(event)">
 <input id="email" type="email" placeholder="Email" required>
 <input id="password" type="password" placeholder="Пароль (мінімум 6 символів)" minlength="6" required>
 <button style="width:100%">Увійти</button></form>
 <button class="secondary" style="width:100%" onclick="signUp()">Створити акаунт</button>
 <p class="muted" id="authMessage" style="margin-top:12px"></p>`);
}
async function signIn(e){
 e.preventDefault();
 const {data,error}=await db.auth.signInWithPassword({
  email:document.getElementById("email").value,
  password:document.getElementById("password").value
 });
 if(error){document.getElementById("authMessage").textContent=error.message;return}
 currentUser=data.user;closeDialog();updateAccount();
}
async function signUp(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;
 if(!email||password.length<6){document.getElementById("authMessage").textContent="Введіть email і пароль від 6 символів";return}
 const {data,error}=await db.auth.signUp({email,password});
 document.getElementById("authMessage").textContent=error?error.message:
 "Реєстрація успішна. Якщо підтвердження email увімкнено, перевірте пошту.";
 if(data.user&&!data.session) return;
 if(data.user){currentUser=data.user;closeDialog();updateAccount()}
}
async function logout(){await db.auth.signOut();currentUser=null;updateAccount();message("Ви вийшли з акаунта")}
function updateAccount(){
 const b=document.getElementById("accountBtn");
 b.textContent=currentUser?"Вийти ("+(currentUser.email||"акаунт")+")":"Увійти";
 b.onclick=currentUser?logout:openAuth;
}

function checkout(){
 if(!cart.length){message("Кошик порожній");return}
 if(!currentUser){toggleCart();openAuth();message("Увійдіть або створіть акаунт для замовлення");return}
 openDialog(`<h2>Оформлення замовлення</h2>
 <form onsubmit="sendOrder(event)">
 <input id="customer" placeholder="Ваше ім’я" required>
 <input id="phone" placeholder="Номер телефону" required>
 <input id="city" placeholder="Місто" required>
 <input id="branch" placeholder="Відділення Нової пошти">
 <textarea id="comment" placeholder="Коментар до замовлення"></textarea>
 <p class="muted">Оплата при отриманні. Підтвердження замовлення буде доступне після оформлення.</p>
 <button style="width:100%">Підтвердити замовлення</button></form>`);
}
async function sendOrder(e){
 e.preventDefault();
 const btn=e.submitter;btn.disabled=true;btn.textContent="Обробка...";
 const items=cart.map(x=>({product_id:x.id,quantity:x.qty}));
 const {data,error}=await db.rpc("create_order",{
  p_customer_name:document.getElementById("customer").value,
  p_phone:document.getElementById("phone").value,
  p_city:document.getElementById("city").value,
  p_nova_poshta_branch:document.getElementById("branch").value,
  p_comment:document.getElementById("comment").value,

 });
